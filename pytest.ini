[pytest]
# Added 2026-09-14, after A-29.
#
# outputs/ and archive/ hold analysis artefacts, not tests. Several of them are
# frozen copies of test modules kept for reproducibility:
#   outputs/hta_results/a28_crn_coupling_fix_*/provenance/test_a4_*.BEFORE_a28.py
#   outputs/hta_results/a29_transmission_block_grouping_*/scripts/test_a29_*.py
# The A-29 copy shares a basename with tests/test_a29_transmission_block_grouping.py,
# which made pytest raise "import file mismatch" and abort collection of the ENTIRE
# suite. Excluding these directories fixes collection without editing either the
# artefacts (addendum-only rule) or the live tests.
#
# Verified: no test_*.py lives outside tests/ in tracked source.
norecursedirs = outputs archive .venv .git __pycache__ .pytest_cache node_modules
